# =============================================================================
#  source_seeker  -  olfactory gas-source seeking (Module 3)
#  Algorithm: module3_gas_safety/source_seeking.py   Docs: README.md
#  Floats are written with a decimal point (rclpy type check).
# =============================================================================
source_seeker:
  ros__parameters:
    layout_file: ""
    map_yaml: ""                    # "" -> layout nav_map; /map replaces it when received
    frame_id: map
    odom_topic: /odom
    control_rate: 10.0              # [Hz]
    status_rate: 2.0                # /gas/seek_status, /gas/source_estimate [Hz]
    path_rate: 1.0                  # /gas/seek_path [Hz]
    use_map_topic: true
    sensor_timeout: 1.0             # stop if /gas/sensor is older [s]
    ground_truth_override: false    # false: layout gas_leak.source for error_m
    ground_truth_x: -3.2
    ground_truth_y: 2.0
    debris_blocked_kinds: "rubble,pipe"  # layout debris the seeker avoids like walls ("" = none; the nav
                                    # map has debris free: the seek walked through the F-OBS5 rubble); an
                                    # item that would close a passage (F-OBS3 at the doorway) stays free

    # ---------------------------------------------------- sensing / thresholds
    detect_ppm: 2.5                 # plume detected
    lost_ppm: 1.2                   # plume lost below this ...
    lost_time: 5.0                  # ... for this long [s] -> CAST
    gradient_min_ppm: 4.0           # minimum concentration for GRADIENT
    found_ppm: 600.0                # FOUND requires c above this + confirmed local maximum
    sensor_lag: 1.0                 # gas sensor time constant -> delay compensation [s]
    filter_tau: 0.4                 # EMA of the nose reading [s]
    nose_offset: [0.42, 0.0]        # must match gas_dispersion_sim
    array_offsets: [0.30, 0.15, 0.30, -0.15, -0.30, 0.15, -0.30, -0.15]
    sensor_noise_ppm: 0.3
    sensor_noise_rel: 0.03
    model_noise_log: 0.05           # unmodelled turbulence (log units)
    log_offset_ppm: 1.0             # c0 in l = ln(c + c0)

    # ---------------------------------------------------- gradient estimation
    window_time: 20.0               # sliding window of nose samples [s]
    window_radius: 2.5              # [m]
    window_sigma: 1.2               # spatial weight [m]
    window_tau: 10.0                # temporal weight [s]
    window_min_samples: 10
    gradient_prior_std: 3.0         # zero-mean prior on grad ln c [1/m]
    drift_prior_std: 0.05           # prior on the temporal drift of ln c [1/s]
    snr_min: 2.0                    # gradient reliable above this SNR
    grad_found_tol: 0.3             # flat-top |grad ln c| [1/m] (starts the confirmation)

    # ---------------------------------------------------- motion
    max_speed: 0.35                 # [m/s]
    max_vy: 0.25                    # lateral speed limit of the legged base [m/s]
    max_wz: 0.8                     # [rad/s]
    k_pos: 1.2
    k_yaw: 1.5
    goal_tolerance: 0.12            # [m]
    yaw_tolerance: 0.25             # [rad]
    robot_radius: 0.35              # clearance kept from obstacles [m]
    repulse_dist: 0.6               # [m]
    repulse_gain: 0.15              # [m/s]

    # ---------------------------------------------------- obstacle detours
    detour_enabled: true            # blocked step -> local A* around the obstacle
    detour_reach: 5.0               # free space searched this far along the blocked step [m]
    detour_window: 8.0              # half size of the local A* window [m]
    detour_max_ratio: 6.0           # route accepted if <= ratio x straight distance + 2 m
    detour_max_length: 20.0         # [m]
    detour_retry_s: 8.0             # no new attempt within 1 m of a failed one for [s]
    waypoint_tolerance: 0.35        # route waypoint reached [m]

    # ---------------------------------------------------- gradient steps
    step_init: 0.8                  # normalised step length alpha_0 [m]
    step_min: 0.25
    step_max: 1.6
    step_grow: 1.3                  # alpha after an accepted improving step
    step_shrink: 0.5                # backtracking factor
    momentum: 0.5
    upwind_bias: 0.5                # weight of the upwind unit vector in the direction
    grad_ref: 0.5                   # |grad ln c| that earns the gradient full weight [1/m]
    armijo_c1: 0.1
    armijo_noise: 0.1               # minimum tolerance of the Armijo test (log units)
    armijo_noise_gain: 1.5          # x residual std of the window fit
    dwell_time: 0.8                 # stop after each step before evaluating it [s]
    max_backtracks: 3

    # ---------------------------------------------------- local maximum confirmation
    probe_radius: 0.6               # first confirmation step [m]
    probe_min_radius: 0.15          # converged below this step [m]
    probe_max_radius: 1.0
    confirm_dwell: 2.0              # dwell per confirmation point [s]
    confirm_snr: 3.0                # dwell-averaged array gradient significance
    confirm_tol: 0.15               # reading drop that abandons a point (fraction)
    max_confirm_moves: 16
    confirm_weight: 0.5             # weight of the confirmation points in the estimate

    # ---------------------------------------------------- search / surge / cast
    wind_min: 0.05                  # below: no usable wind direction [m/s]
    wind_tau: 3.0                   # anemometer EMA [s]
    search_leg_max: 20.0            # legs run wall to wall up to this length [m]
    search_leg_min: 1.0
    search_cell: 1.0                # coverage memory cell [m]
    search_mark_radius: 1.5
    search_sweep: 6.0               # leg length that earns full novelty [m]
    search_w_novelty: 1.0
    search_w_cross: 0.6
    search_w_upwind: 0.2
    search_w_length: 0.1
    search_w_reverse: 0.3
    surge_cross_gain: 0.8
    surge_lookahead: 1.0            # [m]
    cast_amp0: 1.0                  # first cast amplitude [m]
    cast_amp_growth: 1.0            # amplitude growth per cycle [m]
    cast_amp_max: 6.0               # -> SEARCH beyond [m]
    cast_drift: 0.3                 # downwind drift of the cast line per leg [m]
    stuck_time: 5.0                 # no progress -> leg finished [s]

    # ---------------------------------------------------- termination / estimate
    timeout: 300.0                  # FAILED after [s]
    top_k: 8                        # bins in the weighted-centroid estimate
    estimate_bin: 0.25              # [m]

    # ---------------------------------------------------- pause / resume
    # /gas/seek/enable false -> true within this time continues an unfinished
    # run (mission pause / teleop override) instead of restarting it; the
    # pause does not count against `timeout`.  0.0 = always restart.
    resume_window_s: 45.0           # [s]

    # ---------------------------------------------------- novel (unmapped) obstacles
    # dusan_common/obstacle_layer.py memory (elevation map step >= step_height, confirmed over
    # frames) merged into the nav map of free_length / detours / the velocity projection.
    obstacle_enabled: true          # false = legacy behaviour (no subscription)
    obstacle_source: elevation      # elevation (cloud step test) | traversability (cost grid)
    obstacle_elevation_topic: /elevation_map/points
    obstacle_traversability_topic: /elevation_map/traversability
    obstacle_frames: odom,map,world # frame ids equal to the /odom pose frame
    obstacle_step_height: 0.22      # [m] = terrain.yaml map.step_crit
    obstacle_step_window: 5         # [cells] = terrain.yaml map.step_window
    obstacle_cost_threshold: 100
    obstacle_max_range: 3.5         # [m]
    obstacle_resolution: 0.1        # [m]
    obstacle_memory_size: 20.0      # [m]
    obstacle_confirm_hits: 2
    obstacle_max_hits: 5
    obstacle_min_known_fraction: 0.5
    obstacle_ignore_radius: 0.55    # [m]
    obstacle_forget_time: 60.0      # [s]
    obstacle_min_cluster: 2
    obstacle_static_tolerance: 0.3  # [m]
    obstacle_shadow_depth: 1.0      # [m] assumed unseen back of an obstacle (line of sight)
    obstacle_idle_period: 1.0       # [s] frame period while not seeking (0 = every frame)
    obstacle_rebuild_period: 1.0    # [s] min. time between nav-grid rebuilds

    # ---------------------------------------------------- lying pipes (layout obstacles of type pipe)
    # a step over a pipe is walked like a patrol crossing (dusan_common/debris_crossing.py,
    # same values as mission.yaml): turn in place square to the pipe before a foot can reach it,
    # then straight over it at a steady pace (no turning / strafing); no step target on a pipe
    crossing_enabled: true
    crossing_approach: 0.9          # [m] (patrol path planning only)
    crossing_depart: 0.8            # [m] (patrol path planning only)
    crossing_max_angle: 0.35        # [rad] (patrol path planning only)
    crossing_end_margin: 0.15       # [m] a step this close past a pipe end still crosses it ...
    crossing_max_oblique: 1.05      # [rad] ... when it meets the pipe axis at most this far from square
    crossing_zone: 0.6              # [m] centre to the pipe axis within which a foot can reach the pipe
    crossing_align_margin: 0.3      # [m] before that zone: turn in place onto the crossing heading
    crossing_align_tol: 0.2         # [rad] heading error that needs the turn in place
    crossing_align_wz: 0.4          # [rad/s]
    crossing_speed: 0.25            # [m/s] steady pace over the pipe
    crossing_wz: 0.0                # [rad/s] yaw rate limit over the pipe
    crossing_near_dist: 0.45        # [m] centre to a pipe that is passed (its end), not crossed: ...
    crossing_near_vx: 0.25          # [m/s] ... slow
    crossing_near_wz: 0.35          # [rad/s]
