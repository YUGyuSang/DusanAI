# =============================================================================
#  Virtual Plant layout  -  SINGLE SOURCE OF TRUTH
# =============================================================================
#  World frame (= Gazebo world = ROS "map" frame):
#    origin = centre of the factory (turbine hall) floor, +X east, +Y north, +Z up
#  Every node (world generator, inspection, gas, safety, dashboard, metrics)
#  reads this file.  Change positions HERE, then re-run tools/generate_world.py.
#  Units: metres, radians, Kelvin, bar/MPa as given per gauge.
# =============================================================================
world_name: plant
robot_name: spot

# ----------------------------------------------------------------------------
# Building shells (visual meshes come from the Codyssey Unity asset package)
# ----------------------------------------------------------------------------
factory:
  mesh_model: factory_hall          # simulation/models/factory_hall (Factory_03.fbx)
  pose: [0.0, 0.0, 0.0, 0.0]        # x y z yaw of the mesh model
  interior: {x_min: -10.0, x_max: 14.9, y_min: -9.0, y_max: 9.0}   # 24.9 x 18 m
  height: 7.3
  floor_z: 0.0
  # measured from the mesh (config/generated/world_geometry.yaml); the actual passage
  # is the corridor door frame (corridor.door_frame, y +-1.22)
  east_opening: {x: 14.9, y_min: -2.39, y_max: 2.24, height: 4.46}  # connects to corridor
  # full-height interior wall of the hall mesh with one doorway: every route between the
  # hall and the corridor passes the door (y door_y, 2.69 m clear height); the back room
  # behind it (x 9.83 .. 14.9) leads to the east opening
  partition: {x_min: 9.80, x_max: 9.83, door_y: [-1.24, 1.21], height: 2.69}

corridor:
  mesh_model: corridor              # simulation/models/corridor (Corridor_Wall_02.fbx)
  pose: [5.30, 0.0, -0.04, 0.0]     # native mesh x 9.77..58.36 -> world 15.07..63.66
  interior: {x_min: 15.07, x_max: 63.6, y_min: -1.8, y_max: 1.8}    # ~48.5 x 3.6 m
  height: 4.0
  door_frame: {x_min: 15.15, x_max: 15.5, y_min: -1.22, y_max: 1.22}  # entrance frame: passage y range
  # descent geometry measured from the corridor mesh (config/generated/world_geometry.yaml;
  # the world generator always uses the measured geometry, these keys are its fallback)
  upper_floor: {x_min: 15.07, x_max: 46.97, z: 0.0}
  descent: {x_min: 46.97, x_max: 51.22}         # stairs (south) + ramp (north)
  # stairs / ramp y_min..y_max are the NAVIGATION BANDS of the layout-only fallback map of
  # module2 (viewpoint_planner.layout_occupancy_map: descent outside the bands = drop-off).
  # They stay conservative until that rasteriser blocks `dropoff` instead; measured extents:
  # stairs y [-1.795, -0.165] (flight x 47.32 .. 48.57, lower floor beyond), ramp y [-0.165, 1.759]
  stairs:                                       # 4 treads = 5 risers of ~0.175 m (upper 0.0 -> lower -0.88)
    y_min: -1.3
    y_max: -0.7
    treads:
      - {z: -0.187, x_min: 47.32, x_max: 47.64}
      - {z: -0.365, x_min: 47.63, x_max: 47.95}
      - {z: -0.543, x_min: 47.93, x_max: 48.26}
      - {z: -0.722, x_min: 48.24, x_max: 48.57}
  ramp: {y_min: -0.1, y_max: 1.7, slope_deg: 11.8}   # plane over the whole descent x range
  # south edge of the ramp: > 0.22 m above the stairs / lower floor, no railing -> occupied
  dropoff: {x_min: 47.6, x_max: 50.2, y_min: -0.30, y_max: -0.10}
  lower_floor: {x_min: 51.22, x_max: 63.6, z: -0.88}

# ----------------------------------------------------------------------------
# Robot home / charging station
# ----------------------------------------------------------------------------
charging_station:
  pad: [61.9, 0.0, -0.88]           # centre of the docking pad (top surface z)
  pad_size: [1.0, 1.0, 0.02]
  dock_pose: [61.9, 0.0, 3.14159265]   # x y yaw the robot must reach to dock
  dock_tolerance: 0.35

robot_spawn: [61.9, 0.0, -0.32, 3.14159265]   # x y z yaw  (z = floor + 0.56, straight legs)

# ----------------------------------------------------------------------------
# Factory machines (mesh models from fac_gastank.unitypackage)
# ----------------------------------------------------------------------------
machines:
  - id: TURBINE-01
    model: turbine_machine          # Main_Machine_01 (3.3 x 8.4 x 3.1 m)
    pose: [-1.5, -4.5, 0.0, 1.5707963]
    scale: 1.0
    footprint: {x_min: -5.7, x_max: 2.7, y_min: -6.15, y_max: -2.85}
  - id: GASTANK-01
    model: gas_tank                 # Main_Machine_02 scaled 0.8 (5.7 x 9.4 x 6.6 m)
    pose: [-6.5, 3.8, 0.0, 0.0]
    scale: 0.8
    footprint: {x_min: -9.35, x_max: -3.65, y_min: -0.9, y_max: 8.5}

# ----------------------------------------------------------------------------
# Analog pressure gauges (dial texture rendered by dusan_common.gauge_design)
#   position = centre of the dial face, normal = direction the dial faces
#   status: value < normal_min or > normal_max -> warning ; outside alarm band -> alarm
# ----------------------------------------------------------------------------
gauge_defaults:
  dial_diameter: 0.30
  sweep_deg: 270.0                  # min at 7:30 o'clock, max at 4:30 o'clock, clockwise
gauges:
  - {id: G01, tag: TURBINE-PI-01, position: [-3.5, -2.55, 1.0], normal: [0, 1, 0],  min: 0.0, max: 10.0, unit: bar, value: 6.2,  normal_min: 2.0, normal_max: 8.0,  alarm_min: 1.0, alarm_max: 9.0}
  - {id: G02, tag: TURBINE-PI-02, position: [-0.5, -2.55, 1.0], normal: [0, 1, 0],  min: 0.0, max: 16.0, unit: bar, value: 11.4, normal_min: 4.0, normal_max: 10.0, alarm_min: 2.0, alarm_max: 13.0}
  - {id: G03, tag: TURBINE-PI-03, position: [3.0, -5.3, 0.9],   normal: [1, 0, 0],  min: 0.0, max: 6.0,  unit: bar, value: 2.3,  normal_min: 1.0, normal_max: 4.0,  alarm_min: 0.5, alarm_max: 5.0}
  - {id: G04, tag: TANK-PI-01,    position: [-3.4, 5.5, 1.2],   normal: [1, 0, 0],  min: 0.0, max: 25.0, unit: bar, value: 18.5, normal_min: 10.0, normal_max: 20.0, alarm_min: 5.0, alarm_max: 22.0}
  - {id: G05, tag: TANK-PI-02,    position: [-3.4, 7.6, 1.0],   normal: [1, 0, 0],  min: 0.0, max: 10.0, unit: bar, value: 3.7,  normal_min: 2.0, normal_max: 6.0,  alarm_min: 1.0, alarm_max: 8.0}
  - {id: G06, tag: PIPE-PI-01,    position: [3.5, 6.10, 1.3],   normal: [0, -1, 0], min: 0.0, max: 4.0,  unit: bar, value: 1.15, normal_min: 1.5, normal_max: 3.0,  alarm_min: 1.0, alarm_max: 3.5}
  - {id: G07, tag: CORR-PI-01,    position: [26.0, 1.25, 1.1],  normal: [0, -1, 0], min: 0.0, max: 10.0, unit: bar, value: 4.8,  normal_min: 3.0, normal_max: 7.0,  alarm_min: 2.0, alarm_max: 8.5}
  - {id: G08, tag: CORR-PI-02,    position: [57.0, -1.25, 0.22], normal: [0, 1, 0], min: 0.0, max: 1.6,  unit: MPa, value: 0.92, normal_min: 0.4, normal_max: 1.2,  alarm_min: 0.2, alarm_max: 1.4}

# ----------------------------------------------------------------------------
# Pipe rack + thermal hot spots (Gazebo Thermal system temperatures)
# ----------------------------------------------------------------------------
thermal:
  ambient_k: 298.15
  warning_k: 333.15                 # 60 C
  alarm_k: 353.15                   # 80 C
  pipe_body_k: 308.15
pipe_rack:
  pipe: {start: [0.0, 6.4, 1.0], end: [9.5, 6.4, 1.0], radius: 0.10}
  supports_x: [0.5, 3.5, 6.5, 9.0]  # box 0.12 x 0.5 x 1.5 posts centred at y = 6.4
  support_size: [0.12, 0.5, 1.5]
hotspots:
  - {id: H01, tag: PIPE-J1,     kind: flange,  position: [2.0, 6.4, 1.0],   axis: [1, 0, 0], radius: 0.16, length: 0.10, temp_k: 318.15}
  - {id: H02, tag: PIPE-J2,     kind: flange,  position: [5.0, 6.4, 1.0],   axis: [1, 0, 0], radius: 0.16, length: 0.10, temp_k: 372.15}
  - {id: H03, tag: PIPE-J3,     kind: flange,  position: [8.0, 6.4, 1.0],   axis: [1, 0, 0], radius: 0.16, length: 0.10, temp_k: 341.15}
  - {id: H04, tag: TURBINE-BRG, kind: bearing, position: [2.85, -3.6, 0.8], axis: [1, 0, 0], radius: 0.15, length: 0.30, temp_k: 388.15}
  - {id: H05, tag: CORR-J1,     kind: flange,  position: [40.0, -1.55, 1.2], axis: [0, 0, 1], radius: 0.10, length: 0.08, temp_k: 358.15}
corridor_pipe_stub: {position: [40.0, -1.55], radius: 0.06, height: 2.5}   # vertical pipe carrying H05 (same axis)

# ----------------------------------------------------------------------------
# Terrain obstacles (earthquake debris).  type: pipe | pallet | rubble | plate | drum | platform
#   pipe:     lying cylinder, centre [x y], yaw, length, diameter  (z = floor + d/2)
#   pallet:   mesh model 'pallet' (1.22 x 1.4 x 0.18), stack = number of pallets
#   rubble:   random small blocks (seeded) inside rect, heights h_min..h_max
#   plate:    slippery steel plate, mu
#   drum:     standing oil drum cylinder
#   platform: low step box
# ----------------------------------------------------------------------------
obstacles:
  # corridor (>= 3 required)
  - {id: C-OBS1, type: pipe,   area: corridor, center: [58.5, -0.2], floor_z: -0.88, yaw: 1.396, length: 2.6, diameter: 0.10}
  - {id: C-OBS2, type: pallet, area: corridor, center: [55.0, 1.0],  floor_z: -0.88, yaw: 1.5708, stack: 1}
  # C-OBS3 leaves a >= 0.9 m passage along the north wall (rubble y <= 0.5, wall face y ~1.76): the
  # 2-6 cm blocks are not crossable yet, the planners' terrain cost (dusan_common.terrain_cost) detours
  - {id: C-OBS3, type: rubble, area: corridor, rect: [37.0, -1.3, 39.0, 0.5], floor_z: 0.0, h_min: 0.02, h_max: 0.06, count: 45, seed: 3}
  - {id: C-OBS4, type: plate,  area: corridor, rect: [30.0, -1.2, 32.5, 1.2], floor_z: 0.0, thickness: 0.01, mu: 0.2}
  - {id: C-OBS5, type: pipe,   area: corridor, center: [22.0, 0.0],  floor_z: 0.0, yaw: 1.92, length: 2.8, diameter: 0.08}
  # factory (>= 5 required)
  - {id: F-OBS1, type: pallet,   area: factory, center: [8.0, 1.8],   floor_z: 0.0, yaw: 0.35, stack: 1}
  - {id: F-OBS2, type: pallet,   area: factory, center: [6.0, -6.8],  floor_z: 0.0, yaw: 0.0,  stack: 2}
  - {id: F-OBS3, type: pipe,     area: factory, center: [10.0, -0.3], floor_z: 0.0, yaw: 1.22, length: 3.0, diameter: 0.12}   # across the partition doorway
  - {id: F-OBS4, type: pipe,     area: factory, center: [0.0, 1.0],   floor_z: 0.0, yaw: 0.52, length: 2.5, diameter: 0.10}
  - {id: F-OBS5, type: rubble,   area: factory, rect: [3.0, -1.5, 6.0, 1.5], floor_z: 0.0, h_min: 0.02, h_max: 0.07, count: 70, seed: 7}
  - {id: F-OBS6, type: drum,     area: factory, center: [-1.0, 4.0],  floor_z: 0.0, radius: 0.30, height: 0.90}
  - {id: F-OBS7, type: drum,     area: factory, center: [-0.35, 4.6], floor_z: 0.0, radius: 0.30, height: 0.90}
  - {id: F-OBS8, type: platform, area: factory, rect: [7.8, -5.2, 9.3, -3.2], floor_z: 0.0, height: 0.10}
  - {id: F-OBS9, type: plate,    area: factory, rect: [0.0, -2.2, 2.0, -0.7], floor_z: 0.0, thickness: 0.01, mu: 0.15}

# ----------------------------------------------------------------------------
# Gas leak (Module 3)  -  dispersion parameters live in
# module3_gas_safety/config/gas_dispersion.yaml, positions live here.
# ----------------------------------------------------------------------------
gas_leak:
  id: LEAK-01
  tag: GASTANK-01 relief valve
  source: [-3.2, 2.0, 0.4]
  valve_prop: [-3.45, 2.0, 0.0]     # small pipe stub + hand wheel next to the tank
  wind_base: [0.40, -0.10]          # m/s, blows from the west wall vents towards the corridor
  visual_particles: true            # Gazebo ParticleEmitter at the source (visual only)

# ----------------------------------------------------------------------------
# Wireless network (Module 3 comm-shadow prediction)
# ----------------------------------------------------------------------------
comm:
  rssi_min_dbm: -80.0               # below this = communication shadow
  access_points:
    - {id: AP1, position: [61.0, 1.4, 2.0], p0_dbm: -30.0}
    - {id: AP2, position: [33.0, -1.4, 3.0], p0_dbm: -30.0}
    - {id: AP3, position: [11.5, 0.0, 4.5], p0_dbm: -30.0}
  path_loss_exponent: 2.2
  wall_attenuation_db: 12.0         # per occupied-cell boundary crossed (occupancy map ray-cast)
  shadow_zones:                     # extra attenuation (metal shielded areas)
    - {id: S1, name: turbine pit (shielded), rect: [-9.8, -8.8, -6.0, -6.3], attenuation_db: 40.0}

# ----------------------------------------------------------------------------
# Named zones (dashboard / report)
# ----------------------------------------------------------------------------
zones:
  - {id: Z-CORR-LOW,  name: Corridor lower level,      rect: [51.22, -1.8, 63.6, 1.8]}
  - {id: Z-DESCENT,   name: Stairs and ramp,           rect: [46.97, -1.8, 51.22, 1.8]}
  - {id: Z-CORR-UP,   name: Corridor upper level,      rect: [15.07, -1.8, 46.97, 1.8]}
  - {id: Z-FACTORY,   name: Turbine hall,              rect: [-10.0, -9.0, 14.9, 9.0]}
  - {id: Z-HOT,       name: High temperature zone,     rect: [2.7, -5.5, 4.5, -2.0]}
  - {id: Z-RF-SHADOW, name: RF shadow (turbine pit),   rect: [-9.8, -8.8, -6.0, -6.3]}

# ----------------------------------------------------------------------------
# 2-D navigation map produced by tools/generate_world.py
# ----------------------------------------------------------------------------
nav_map:
  yaml: maps/plant_map.yaml         # relative to plant_simulation share dir
  resolution: 0.10
  bounds: [-10.6, -9.6, 64.2, 9.6]  # x_min y_min x_max y_max
